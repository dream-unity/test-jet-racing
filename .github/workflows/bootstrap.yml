name: Diagnose and bootstrap Vector Apex source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'
  pull_request:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vector-apex-bootstrap
  cancel-in-progress: false

jobs:
  unpack-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose archive transport corruption
        shell: bash
        run: |
          python3 - <<'PY'
          from base64 import b64decode
          from glob import glob
          from heapq import nlargest
          from pathlib import Path
          import zlib

          paths = sorted(glob('.bootstrap/payload.[0-9][0-9]'))
          expected = [f'.bootstrap/payload.{index:02d}' for index in range(6)]
          if paths != expected:
              raise SystemExit(f'Unexpected payload set: {paths}')
          parts = []
          for path in paths:
              text = Path(path).read_text(encoding='utf-8')
              clean = ''.join(ch for ch in text if ch.isascii() and (ch.isalnum() or ch in '+/='))
              parts.append(clean)
              print(path, len(clean), clean[:8], clean[-8:])
          stream = ''.join(parts)
          print('stream', len(stream), 'mod4', len(stream) % 4)

          def prefix_score(encoded):
              try:
                  archive = b64decode(encoded, validate=True)
              except Exception:
                  return (-1, -1, '')
              if not archive.startswith(b'\x1f\x8b\x08'):
                  return (0, 0, archive[:8].hex())
              decoder = zlib.decompressobj(31)
              output_size = 0
              compressed_offset = 0
              chunk_size = 128
              try:
                  for compressed_offset in range(0, len(archive), chunk_size):
                      output_size += len(decoder.decompress(archive[compressed_offset:compressed_offset + chunk_size]))
                  output_size += len(decoder.flush())
                  return (output_size, len(archive), 'complete')
              except zlib.error as error:
                  return (output_size, compressed_offset, str(error))

          first = parts[0]
          suffix = ''.join(parts[1:])
          scores = []
          for position in range(len(first)):
              encoded = first[:position] + first[position + 1:] + suffix
              output_size, compressed_offset, detail = prefix_score(encoded)
              scores.append((output_size, compressed_offset, position, first[position], detail))
              if (position + 1) % 4000 == 0:
                  print('scored', position + 1, 'deletions')

          print('TOP DELETION CANDIDATES')
          for score in nlargest(40, scores):
              print(score)
          best = max(scores)
          raise SystemExit(f'Diagnostic complete; best={best}')
          PY

# This diagnostic never publishes unverified source.
