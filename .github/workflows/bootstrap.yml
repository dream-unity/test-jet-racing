name: Bootstrap Vector Apex source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  pull_request:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vector-apex-bootstrap
  cancel-in-progress: false

jobs:
  unpack-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct source archive
        shell: bash
        run: |
          python3 - <<'PY'
          from base64 import b64decode
          from binascii import Error as Base64Error
          from glob import glob
          from hashlib import sha256
          from pathlib import Path

          expected_sha = 'c7aa0fafce73792a524fe88293e85a21946b82bb0dc9564484fb8677fd8917fb'
          paths = sorted(glob('.bootstrap/payload.[0-9][0-9]'))
          expected_paths = [f'.bootstrap/payload.{index:02d}' for index in range(6)]
          if paths != expected_paths:
              raise SystemExit(f'Unexpected payload set: {paths}')

          parts = []
          for path in paths:
              encoded = Path(path).read_text(encoding='utf-8')
              clean = ''.join(character for character in encoded if character.isascii() and (character.isalnum() or character in '+/='))
              parts.append(clean)
              print(f'{path}: raw={len(encoded)} bounded={len(clean)} prefix={clean[:8]!r} suffix={clean[-8:]!r}')

          stream = ''.join(parts)
          print(f'Combined bounded stream length: {len(stream)} (mod 4 = {len(stream) % 4})')

          def verified_archive(candidate):
              try:
                  archive = b64decode(candidate, validate=True)
              except Base64Error:
                  return None
              return archive if sha256(archive).hexdigest() == expected_sha else None

          archive = verified_archive(stream)
          repair_index = None
          repair_character = None

          # The stream is exactly one Base64 character longer than a valid
          # encoding. Search every possible single-character deletion and
          # accept only the unique candidate matching the immutable archive
          # digest. This repairs transport framing without weakening integrity.
          if archive is None and len(stream) % 4 == 1:
              priority_positions = []
              cursor = 0
              for part in parts:
                  priority_positions.extend([cursor, cursor + len(part) - 1])
                  cursor += len(part)
              seen = set()
              ordered_positions = []
              for position in priority_positions:
                  if 0 <= position < len(stream) and position not in seen:
                      seen.add(position)
                      ordered_positions.append(position)
              ordered_positions.extend(position for position in range(len(stream)) if position not in seen)

              for attempt, position in enumerate(ordered_positions, start=1):
                  candidate = stream[:position] + stream[position + 1:]
                  candidate_archive = verified_archive(candidate)
                  if candidate_archive is not None:
                      archive = candidate_archive
                      repair_index = position
                      repair_character = stream[position]
                      break
                  if attempt % 10000 == 0:
                      print(f'Checked {attempt} single-character repair positions…')

          if archive is None:
              raise SystemExit('No exact single-character repair matched the mandatory SHA-256')

          Path('/tmp/vector-apex-project.tar.gz').write_bytes(archive)
          if repair_index is None:
              print(f'Reconstructed verified archive without repair: {len(archive)} bytes')
          else:
              print(f'Reconstructed verified archive: removed {repair_character!r} at Base64 index {repair_index}; {len(archive)} bytes')
          PY
          echo 'c7aa0fafce73792a524fe88293e85a21946b82bb0dc9564484fb8677fd8917fb  /tmp/vector-apex-project.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/vector-apex-project.tar.gz -C .
          rm -rf .bootstrap .github/workflows/bootstrap.yml
      - name: Validate reconstructed project
        run: npm test
      - name: Commit complete playable source
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build Dream Unity Vector Apex fighter-jet racing game'
          git push origin HEAD:main

# Transport repair is accepted only by the immutable archive SHA-256.
