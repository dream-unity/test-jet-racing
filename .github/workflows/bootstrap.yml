name: Recover verified Vector Apex source

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: vector-apex-source-recovery
  cancel-in-progress: false

jobs:
  recover-test-and-publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source payload ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Recover archive by cryptographic identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64
          import binascii
          import hashlib
          import shutil
          import tarfile

          expected = 'c7aa0fafce73792a524fe88293e85a21946b82bb0dc9564484fb8677fd8917fb'
          parts = sorted(Path('.bootstrap').glob('payload.[0-9][0-9]'))
          if len(parts) != 6:
              raise SystemExit(f'Expected six source chunks, found {len(parts)}')
          chunks = [''.join(path.read_text(encoding='ascii').split()) for path in parts]
          print('payload lengths:', [len(chunk) for chunk in chunks])
          stream = ''.join(chunks)

          def verified_decode(text):
              try:
                  decoded = base64.b64decode(text.encode('ascii'), validate=True)
              except (binascii.Error, UnicodeEncodeError):
                  return None
              return decoded if hashlib.sha256(decoded).hexdigest() == expected else None

          archive = verified_decode(stream)
          repair = 'none'
          if archive is None:
              first = chunks[0]
              suffix = ''.join(chunks[1:])
              for index in range(len(first)):
                  archive = verified_decode(first[:index] + first[index + 1:] + suffix)
                  if archive is not None:
                      repair = f'deleted surplus payload.00 character at zero-based offset {index}'
                      break

          if archive is None:
              raise SystemExit('No single-character repair reproduced the expected SHA-256 archive')

          archive_path = Path('/tmp/vector-apex-project.tar.gz')
          destination = Path('/tmp/vector-apex-source')
          archive_path.write_bytes(archive)
          shutil.rmtree(destination, ignore_errors=True)
          destination.mkdir(parents=True)

          with tarfile.open(archive_path, mode='r:gz') as bundle:
              members = bundle.getmembers()
              for member in members:
                  normalized = member.name.replace('\\', '/')
                  while normalized.startswith('./'):
                      normalized = normalized[2:]
                  path = PurePosixPath(normalized)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe archive member: {member.name}')
              bundle.extractall(destination, filter='data')

          required = ['index.html', 'package.json']
          missing = [name for name in required if not (destination / name).is_file()]
          if missing:
              raise SystemExit(f'Archive omitted required files: {missing}')

          print('archive recovered:', repair)
          print('archive bytes:', len(archive))
          print('archive sha256:', hashlib.sha256(archive).hexdigest())
          print('safe members:', len(members))
          PY

          rsync -a --delete --exclude='.git/' /tmp/vector-apex-source/ ./
          touch .nojekyll
          rm -rf .bootstrap .publish
          rm -rf .github/workflows/bootstrap.yml .github/workflows/publish-output.yml
          test -s index.html
          test -s package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate complete reconstructed project
        run: npm test

      - name: Publish tested source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B recovered-vector-apex-source
          git add -A
          git commit -m 'Recover and validate complete Vector Apex game source'
          git push --force origin HEAD:refs/heads/recovered-vector-apex-source
