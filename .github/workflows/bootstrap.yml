name: Install verified fighter-jet game source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-verified-jet-game
  cancel-in-progress: false

jobs:
  reconstruct-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify complete game source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from base64 import b64decode
          from glob import glob
          from hashlib import sha256
          from pathlib import Path, PurePosixPath
          import shutil
          import tarfile

          EXPECTED_SHA = 'c7aa0fafce73792a524fe88293e85a21946b82bb0dc9564484fb8677fd8917fb'
          payloads = sorted(glob('.bootstrap/payload.[0-9][0-9]'))
          expected = [f'.bootstrap/payload.{index:02d}' for index in range(6)]
          if payloads != expected:
              raise SystemExit(f'Unexpected payload set: {payloads}')

          encoded_parts = []
          for payload in payloads:
              text = Path(payload).read_text(encoding='ascii')
              clean = ''.join(text.split())
              invalid = set(clean) - set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
              if invalid:
                  raise SystemExit(f'Invalid base64 characters in {payload}: {sorted(invalid)!r}')
              encoded_parts.append(clean)
              print(f'{payload}: {len(clean)} base64 characters')

          encoded = ''.join(encoded_parts)
          if len(encoded) % 4:
              raise SystemExit(f'Combined base64 length is not divisible by four: {len(encoded)}')

          archive = b64decode(encoded, validate=True)
          digest = sha256(archive).hexdigest()
          if digest != EXPECTED_SHA:
              raise SystemExit(f'Archive SHA-256 mismatch: expected {EXPECTED_SHA}, got {digest}')
          if not archive.startswith(b'\x1f\x8b\x08'):
              raise SystemExit('Verified archive is not gzip data')

          archive_path = Path('/tmp/jet-relation-source.tar.gz')
          destination = Path('/tmp/jet-relation-source')
          archive_path.write_bytes(archive)
          shutil.rmtree(destination, ignore_errors=True)
          destination.mkdir(parents=True)

          with tarfile.open(archive_path, mode='r:gz') as bundle:
              members = bundle.getmembers()
              for member in members:
                  normalized = member.name.replace('\\', '/')
                  while normalized.startswith('./'):
                      normalized = normalized[2:]
                  path = PurePosixPath(normalized)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe archive member: {member.name}')
              bundle.extractall(destination, filter='data')

          required = ['index.html', 'package.json', 'js/main.js', 'tests/validate.mjs']
          missing = [name for name in required if not (destination / name).is_file()]
          if missing:
              raise SystemExit(f'Archive omitted required files: {missing}')

          print(f'Archive verified at {digest}; extracted {len(members)} safe members')
          PY

          rsync -a --delete --exclude='.git/' /tmp/jet-relation-source/ ./
          touch .nojekyll
          rm -rf .bootstrap .publish
          rm -rf .github/workflows

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate relational engine and static deployment
        run: npm test

      - name: Commit complete tested game directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy complete Dream Unity fighter-jet relational racing game'
          git push origin HEAD:main
