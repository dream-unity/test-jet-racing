name: Bootstrap Vector Apex source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  pull_request:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vector-apex-bootstrap
  cancel-in-progress: false

jobs:
  unpack-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct source archive
        shell: bash
        run: |
          python3 - <<'PY'
          from base64 import b64decode
          from glob import glob
          from hashlib import sha256
          from itertools import product
          from pathlib import Path

          expected_sha = 'c7aa0fafce73792a524fe88293e85a21946b82bb0dc9564484fb8677fd8917fb'
          parts = sorted(glob('.bootstrap/payload.[0-9][0-9]'))
          expected_parts = [f'.bootstrap/payload.{index:02d}' for index in range(6)]
          if parts != expected_parts:
              raise SystemExit(f'Unexpected payload set: {parts}')

          variant_sets = []
          for path in parts:
              encoded = Path(path).read_text(encoding='utf-8')
              clean = ''.join(character for character in encoded if character.isascii() and (character.isalnum() or character in '+/='))
              variants = []
              for label, value in [('drop-end', clean[:-1]), ('drop-start', clean[1:]), ('unaltered', clean)]:
                  if value and value not in [existing for _, existing in variants]:
                      variants.append((label, value))
              variant_sets.append(variants)
              print(f'{path}: raw={len(encoded)} bounded={len(clean)} prefix={clean[:8]!r} suffix={clean[-8:]!r}')

          found = None
          for chosen in product(*variant_sets):
              labels = [label for label, _ in chosen]
              texts = [value for _, value in chosen]
              try:
                  archive = b64decode(''.join(texts), validate=True)
                  if sha256(archive).hexdigest() == expected_sha:
                      found = (archive, labels, 'joined-stream')
                      break
              except Exception:
                  pass
              try:
                  archive = b''.join(b64decode(value, validate=True) for value in texts)
                  if sha256(archive).hexdigest() == expected_sha:
                      found = (archive, labels, 'independent-chunks')
                      break
              except Exception:
                  pass

          if found is None:
              raise SystemExit('No bounded edge-trim reconstruction matched the mandatory SHA-256')
          archive, labels, mode = found
          Path('/tmp/vector-apex-project.tar.gz').write_bytes(archive)
          print(f'Reconstructed {len(archive)} bytes via {mode}: {labels}')
          PY
          echo 'c7aa0fafce73792a524fe88293e85a21946b82bb0dc9564484fb8677fd8917fb  /tmp/vector-apex-project.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/vector-apex-project.tar.gz -C .
          rm -rf .bootstrap .github/workflows/bootstrap.yml
      - name: Validate reconstructed project
        run: npm test
      - name: Commit complete playable source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build Dream Unity Vector Apex fighter-jet racing game'
          git push origin HEAD:main

# Pull-request trigger added for inspectable deployment validation on 2026-08-24.
