name: Recover verified Vector Apex source

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: vector-apex-source-recovery
  cancel-in-progress: false

jobs:
  recover-test-and-publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source payload ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Recover archive by cryptographic identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from io import BytesIO
          import base64
          import binascii
          import hashlib
          import shutil
          import struct
          import tarfile
          import zlib

          expected = 'c7aa0fafce73792a524fe88293e85a21946b82bb0dc9564484fb8677fd8917fb'
          parts = sorted(Path('.bootstrap').glob('payload.[0-9][0-9]'))
          if len(parts) != 6:
              raise SystemExit(f'Expected six source chunks, found {len(parts)}')
          chunks = [''.join(path.read_text(encoding='ascii').split()) for path in parts]
          print('payload lengths:', [len(chunk) for chunk in chunks])
          stream = ''.join(chunks)

          def digest(data):
              return hashlib.sha256(data).hexdigest()

          def decode(text):
              try:
                  return base64.b64decode(text.encode('ascii'), validate=True)
              except (binascii.Error, UnicodeEncodeError):
                  return None

          def verified_decode(text):
              decoded = decode(text)
              return decoded if decoded is not None and digest(decoded) == expected else None

          def gzip_header_length(data):
              if len(data) < 18 or data[:3] != b'\x1f\x8b\x08':
                  return None
              flags = data[3]
              if flags & 0xE0:
                  return None
              cursor = 10
              if flags & 0x04:
                  if cursor + 2 > len(data):
                      return None
                  xlen = struct.unpack_from('<H', data, cursor)[0]
                  cursor += 2 + xlen
              for flag in (0x08, 0x10):
                  if flags & flag:
                      terminator = data.find(b'\x00', cursor)
                      if terminator < 0:
                          return None
                      cursor = terminator + 1
              if flags & 0x02:
                  cursor += 2
              return cursor if cursor < len(data) - 8 else None

          def repair_gzip_trailer(decoded):
              header_length = gzip_header_length(decoded)
              if header_length is None:
                  return None, None
              decompressor = zlib.decompressobj(-zlib.MAX_WBITS)
              try:
                  output = decompressor.decompress(decoded[header_length:])
                  output += decompressor.flush()
              except zlib.error:
                  return None, None
              if not decompressor.eof or len(decompressor.unused_data) < 8:
                  return None, None
              compressed_end = len(decoded) - len(decompressor.unused_data)
              trailer = struct.pack('<II', zlib.crc32(output) & 0xFFFFFFFF, len(output) & 0xFFFFFFFF)
              repaired = decoded[:compressed_end] + trailer
              try:
                  with tarfile.open(fileobj=BytesIO(repaired), mode='r:gz') as bundle:
                      members = bundle.getmembers()
              except (tarfile.TarError, OSError):
                  return None, None
              return repaired, (len(output), len(members))

          archive = verified_decode(stream)
          repair = 'none'
          first = chunks[0]
          suffix = ''.join(chunks[1:])
          trailer_candidates = []

          if archive is None:
              for index in range(len(first)):
                  candidate_text = first[:index] + first[index + 1:] + suffix
                  decoded = decode(candidate_text)
                  if decoded is None:
                      continue
                  if digest(decoded) == expected:
                      archive = decoded
                      repair = f'deleted surplus payload.00 character at zero-based offset {index}'
                      break
                  repaired, metadata = repair_gzip_trailer(decoded)
                  if repaired is not None:
                      candidate_hash = digest(repaired)
                      trailer_candidates.append((index, candidate_hash, metadata))
                      if candidate_hash == expected:
                          archive = repaired
                          repair = f'deleted payload.00 offset {index} and restored canonical gzip CRC/size trailer'
                          break

          if archive is None:
              print('valid gzip/tar trailer-repair candidates:', trailer_candidates[:20])
              raise SystemExit('No deterministic repair reproduced the expected SHA-256 archive')

          archive_path = Path('/tmp/vector-apex-project.tar.gz')
          destination = Path('/tmp/vector-apex-source')
          archive_path.write_bytes(archive)
          shutil.rmtree(destination, ignore_errors=True)
          destination.mkdir(parents=True)

          with tarfile.open(archive_path, mode='r:gz') as bundle:
              members = bundle.getmembers()
              for member in members:
                  normalized = member.name.replace('\\', '/')
                  while normalized.startswith('./'):
                      normalized = normalized[2:]
                  path = PurePosixPath(normalized)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe archive member: {member.name}')
              bundle.extractall(destination, filter='data')

          required = ['index.html', 'package.json']
          missing = [name for name in required if not (destination / name).is_file()]
          if missing:
              raise SystemExit(f'Archive omitted required files: {missing}')

          print('archive recovered:', repair)
          print('archive bytes:', len(archive))
          print('archive sha256:', digest(archive))
          print('safe members:', len(members))
          PY

          rsync -a --delete --exclude='.git/' /tmp/vector-apex-source/ ./
          touch .nojekyll
          rm -rf .bootstrap .publish
          rm -rf .github/workflows/bootstrap.yml .github/workflows/publish-output.yml
          test -s index.html
          test -s package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate complete reconstructed project
        run: npm test

      - name: Publish tested source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B recovered-vector-apex-source
          git add -A
          git commit -m 'Recover and validate complete Vector Apex game source'
          git push --force origin HEAD:refs/heads/recovered-vector-apex-source
