name: Publish verified game source branch

on:
  pull_request:
    branches: [main]
    paths:
      - '.publish/**'
      - '.github/workflows/publish-output.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jet-relation-verified-output
  cancel-in-progress: false

jobs:
  reconstruct-test-publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out current merge candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact verified source archive
        shell: bash
        run: |
          python3 - <<'PY'
          from base64 import b64decode
          from glob import glob
          from hashlib import sha256
          from pathlib import Path, PurePosixPath
          import shutil
          import tarfile

          expected_sha = 'c7aa0fafce73792a524fe88293e85a21946b82bb0dc9564484fb8677fd8917fb'
          payloads = sorted(glob('.bootstrap/payload.[0-9][0-9]'))
          expected = [f'.bootstrap/payload.{index:02d}' for index in range(6)]
          if payloads != expected:
              raise SystemExit(f'Unexpected payload set: {payloads}')

          encoded = ''
          for payload in payloads:
              text = Path(payload).read_text(encoding='utf-8')
              clean = ''.join(character for character in text if character.isascii() and (character.isalnum() or character in '+/='))
              print(f'{payload}: {len(clean)} bounded base64 characters')
              encoded += clean

          archive = b64decode(encoded, validate=True)
          digest = sha256(archive).hexdigest()
          if digest != expected_sha:
              raise SystemExit(f'Archive SHA-256 mismatch: {digest}')
          if not archive.startswith(b'\x1f\x8b\x08'):
              raise SystemExit('Verified archive is not gzip data')

          archive_path = Path('/tmp/jet-relation-source.tar.gz')
          destination = Path('/tmp/jet-relation-source')
          archive_path.write_bytes(archive)
          shutil.rmtree(destination, ignore_errors=True)
          destination.mkdir(parents=True)

          with tarfile.open(archive_path, mode='r:gz') as bundle:
              members = bundle.getmembers()
              for member in members:
                  normalized = member.name.replace('\\', '/')
                  while normalized.startswith('./'):
                      normalized = normalized[2:]
                  path = PurePosixPath(normalized)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe archive member: {member.name}')
              bundle.extractall(destination, filter='data')

          required = ['index.html', 'package.json', 'js/main.js', 'tests/validate.mjs']
          missing = [name for name in required if not (destination / name).is_file()]
          if missing:
              raise SystemExit(f'Archive omitted required files: {missing}')
          print(f'Verified SHA-256 and extracted {len(members)} safe archive members')
          PY

          rsync -a --delete --exclude='.git/' /tmp/jet-relation-source/ ./

      - name: Generate deterministic GitHub Pages deployment files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          pages = dedent('''\
          name: Validate and deploy Jet Relation

          on:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: github-pages
            cancel-in-progress: true

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - name: Check out game
                  uses: actions/checkout@v4
                - name: Set up Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - name: Validate procedural logic and static deployment
                  run: npm test

            deploy:
              needs: validate
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              runs-on: ubuntu-latest
              steps:
                - name: Check out game
                  uses: actions/checkout@v4
                - name: Configure GitHub Pages
                  uses: actions/configure-pages@v5
                  with:
                    enablement: true
                - name: Upload static site
                  uses: actions/upload-pages-artifact@v3
                  with:
                    path: .
                - name: Deploy to GitHub Pages
                  id: deployment
                  uses: actions/deploy-pages@v4
          ''')
          workflow = Path('.github/workflows/pages.yml')
          workflow.parent.mkdir(parents=True, exist_ok=True)
          workflow.write_text(pages, encoding='utf-8')
          Path('.nojekyll').touch()
          PY

          rm -rf .bootstrap .publish
          rm -f .github/workflows/bootstrap.yml .github/workflows/publish-output.yml

      - name: Validate procedural engine and static deployment
        run: npm test

      - name: Publish tested tree to isolated output branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build Dream Unity fighter-jet relational racing game'
          git push --force origin HEAD:refs/heads/verified-game-source-20260824
